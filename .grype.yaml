# Grype ignore rules for anchor-watch-image.
#
# CONVENTION: every rule's `reason` MUST carry an [expires:YYYY-MM-DD] tag. The
# `security:exception-audit` job fails the build when an entry expires or omits the
# tag, forcing re-review. At expiry, re-check: has a fix aged into the 14-day soak
# window, has reachability changed, is there a new advisory? Then renew the date or
# drop the rule and address the finding.
#
# Entries are listed PER CVE rather than by package type, so a new, fixable CVE in
# the same package still fails the build instead of hiding behind a blanket rule.
#
# An entry is deleted, not renewed, once the finding stops matching -- a rule that
# excepts nothing is indistinguishable from one that hides something.
#
# WHAT THIS IMAGE IS, for reachability purposes: a CI drift-detection runner. It
# executes inside an ephemeral GitLab job container, accepts no inbound network
# connections, is not internet-facing, and handles no untrusted input beyond the
# repository already checked out by the runner. Its only outbound traffic is HTTPS
# to the Anthropic API and to package/registry hosts, all trusted origins. It runs
# no server of any kind and exits when its one script finishes. No proxy, no
# .netrc, no mTLS client config, and no curl CLI -- libcurl is present only as
# git's HTTPS transport. It also carries no package manager: npm, npx, yarn and
# corepack live in the build stage only, so nothing under a package manager's own
# vendored tree can ever appear in a finding here.
#
# Scans intentionally do NOT pass --only-fixed, so no-fix malware advisories still
# gate. These are deliberate, reviewed exceptions, not a blanket.

ignore:
  # ─────────────────────────────────────────────────────────────────────────────
  # Our npm tree, at /opt/sdk/node_modules. This is the only JavaScript in the
  # runtime image, and it IS ours to fix -- a package-lock refresh takes it -- so
  # the only thing that holds a fix back is the 14-day soak.
  # ─────────────────────────────────────────────────────────────────────────────

  # proxy-addr is express's, and express arrives as a peer dependency of
  # @modelcontextprotocol/sdk. The MCP SDK uses it only in its
  # HTTP-server helpers (server/express.js and the auth router), which the Agent SDK
  # never imports -- it loads server/mcp.js and types.js, neither of which reaches
  # express. A lockfile refresh takes 2.0.8 within express's ^2.0.7 range.
  - vulnerability: GHSA-jqcg-44mw-7w3h
    reason: "proxy-addr compiles a short-prefix IPv4-mapped IPv6 trust subnet (e.g. ::ffff:10.0.0.0/8) so that it matches every IPv4 address, letting a client spoof req.ip via X-Forwarded-For; exploitation requires an Express server configured with such a trust-proxy subnet that relies on the client IP, and this image runs no HTTP server -- express is reachable only through @modelcontextprotocol/sdk's server/express.js and auth router, which the Agent SDK never imports (it loads server/mcp.js and types.js only); transitive via @anthropic-ai/claude-agent-sdk -> @modelcontextprotocol/sdk -> express; fixed in 2.0.8, published 2026-09-15 and soaking 2026-09-29 [expires:2026-11-06]"

  # body-parser is express's too, reached the same way, so it rests on the same
  # import set. A lockfile refresh takes 2.4.0 within express's ^2.2.1 range.
  - vulnerability: GHSA-27r3-jxmh-p828
    reason: "body-parser leaves the decompression stream for a Content-Encoding request body piped with no error listener, so trailing bytes after one valid compressed frame raise an uncaught exception that terminates the process; exploitation requires an HTTP server parsing request bodies from untrusted clients, and this image runs no HTTP server -- express is reachable only through @modelcontextprotocol/sdk's server/express.js and auth router, which the Agent SDK never imports (it loads server/mcp.js and types.js only); transitive via @anthropic-ai/claude-agent-sdk -> @modelcontextprotocol/sdk -> express -> body-parser; fixed in 2.4.0, published 2026-10-22 and soaking 2026-11-05 [expires:2026-12-08]"

  # zod, unlike the entries above, is code that runs: the Agent SDK and the MCP SDK
  # validate messages with it. What keeps it out of reach is where those messages
  # come from. Because the code does run, the expiry sits close behind the fix's
  # soak date; a lockfile refresh takes 4.6.6 within every dependent's ^4 range.
  - vulnerability: GHSA-mrhx-c7xc-m3w5
    reason: "zod's $ZodArray accumulates a validation issue for every failing element with no cap, so a very large array checked against a schema with no length constraint can exhaust heap; exploitation requires an attacker to submit that array, and the only data zod validates here is the JSON-RPC and tool-call traffic between the Agent SDK and the Claude Code subprocess it spawns -- no network input reaches it, and the worst case is an out-of-memory exit of one ephemeral CI job; peer dependency of @anthropic-ai/claude-agent-sdk and @modelcontextprotocol/sdk; fixed in 4.6.6, published 2026-10-11 and soaking 2026-10-25 [expires:2026-11-08]"
