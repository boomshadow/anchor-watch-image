# Grype ignore rules for anchor-watch-image.
#
# CONVENTION: every rule's `reason` MUST carry an [expires:YYYY-MM-DD] tag. The
# `security:exception-audit` job fails the build when an entry expires or omits the
# tag, forcing re-review. At expiry, re-check: has a fix aged into the 14-day soak
# window, has reachability changed, is there a new advisory? Then renew the date or
# drop the rule and address the finding.
#
# Entries are listed PER CVE rather than by package type, so a new, fixable CVE in
# the same package still fails the build instead of hiding behind a blanket rule.
#
# An entry is deleted, not renewed, once the finding stops matching -- a rule that
# excepts nothing is indistinguishable from one that hides something.
#
# WHAT THIS IMAGE IS, for reachability purposes: a CI drift-detection runner. It
# executes inside an ephemeral GitLab job container, accepts no inbound network
# connections, is not internet-facing, and handles no untrusted input beyond the
# repository already checked out by the runner. Its only outbound traffic is HTTPS
# to the Anthropic API and to package/registry hosts, all trusted origins. It runs
# no server of any kind and exits when its one script finishes. No proxy, no
# .netrc, no mTLS client config, and no curl CLI -- libcurl is present only as
# git's HTTPS transport. It also carries no package manager: npm, npx, yarn and
# corepack live in the build stage only, so nothing under a package manager's own
# vendored tree can ever appear in a finding here.
#
# Scans intentionally do NOT pass --only-fixed, so no-fix malware advisories still
# gate. These are deliberate, reviewed exceptions, not a blanket.

ignore:
  - vulnerability: CVE-2026-124709
    reason: "OpenSSL's QUIC server keeps the state of a peer-opened stream it rejects if the peer resets it first, so a client can grow server memory with repeated open/reset cycles; exploitation requires an OpenSSL QUIC server, and nothing in this image uses OpenSSL's QUIC stack -- its only consumers are libcurl (git's HTTPS transport, built without HTTP/3: no ngtcp2 or nghttp3), busybox ssl_client and apk-tools, all TLS-over-TCP clients, while node bundles its own OpenSSL and Claude Code uses Bun's; OpenSSL rates it Low; fixed in 3.5.10, scheduled for 2026-12-01 and not yet released, with Alpine 3.24 and edge both on 3.5.9-r1 [expires:2026-12-22]"
  - vulnerability: CVE-2026-107494
    reason: "OpenSSL's QUIC stack queues a RETIRE_CONNECTION_ID frame again whenever a NEW_CONNECTION_ID frame is retransmitted, so a malicious QUIC peer can grow that queue without bound; exploitation requires a QUIC connection made with OpenSSL's QUIC stack, and nothing in this image makes one -- libcurl here is built without HTTP/3 (no ngtcp2 or nghttp3), and busybox ssl_client and apk-tools speak TLS over TCP only, while node and Claude Code carry their own TLS stacks; fixed in 3.5.10, scheduled for 2026-12-01 and not yet released, with Alpine 3.24 and edge both on 3.5.9-r1 [expires:2026-12-22]"
  - vulnerability: CVE-2026-84786
    reason: "a DANE-enabled OpenSSL TLS client can dereference a NULL pointer when the server presents a trusted CA's certificate as its end-entity certificate alongside an unusual mix of PKIX-TA/PKIX-EE and DANE-TA TLSA records; exploitation requires the client to enable DANE through SSL_dane_enable(), and none of this image's OpenSSL consumers do -- libcurl, busybox ssl_client and apk-tools verify servers by PKIX only, and the worst case is a crash of one ephemeral CI job; fixed in 3.5.10, scheduled for 2026-12-01 and not yet released, with Alpine 3.24 and edge both on 3.5.9-r1 [expires:2026-12-22]"
  - vulnerability: CVE-2026-121482
    reason: "OpenSSL mishandles verification of a maliciously crafted CMS or PKCS#7 SignedData message; exploitation requires an application to verify attacker-supplied CMS or PKCS#7 data, and nothing in this image does -- libcurl and busybox ssl_client only negotiate TLS, apk-tools verifies its own RSA package signatures rather than CMS, and git has no gpgsm for X.509 signature verification; fixed in 3.5.10, scheduled for 2026-12-01 and not yet released, with Alpine 3.24 and edge both on 3.5.9-r1 [expires:2026-12-22]"
  - vulnerability: CVE-2026-107493
    reason: "PEM_X509_INFO_read_bio_ex() frees the entries of a caller-supplied stack on a failed read but leaves them in the stack, so the caller later uses freed memory; exploitation requires an application that passes a non-NULL stack and then reads PEM data an attacker can corrupt, and OpenSSL's own callers, TLS CA loading among them, always pass NULL -- the CA bundle this image's clients load is the baked-in ca-certificates-bundle, not attacker input; OpenSSL rates it Low; fixed in 3.5.10, scheduled for 2026-12-01 and not yet released, with Alpine 3.24 and edge both on 3.5.9-r1 [expires:2026-12-22]"
