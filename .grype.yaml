# Grype ignore rules for anchor-watch-image.
#
# CONVENTION: every rule's `reason` MUST carry an [expires:YYYY-MM-DD] tag. The
# `security:exception-audit` job fails the build when an entry expires or omits the
# tag, forcing re-review. At expiry, re-check: has a fix aged into the 45-day soak
# window, has reachability changed, is there a new advisory? Then renew the date or
# drop the rule and address the finding.
#
# Entries are listed PER CVE rather than by package type, so a new, fixable CVE in
# the same package still fails the build instead of hiding behind a blanket rule.
#
# An entry is deleted, not renewed, once the finding stops matching -- a rule that
# excepts nothing is indistinguishable from one that hides something.
#
# WHAT THIS IMAGE IS, for reachability purposes: a CI drift-detection runner. It
# executes inside an ephemeral GitLab job container, accepts no inbound network
# connections, is not internet-facing, and handles no untrusted input beyond the
# repository already checked out by the runner. Its only outbound traffic is HTTPS
# to the Anthropic API and to package/registry hosts, all trusted origins. It runs
# no server of any kind and exits when its one script finishes. No proxy, no
# .netrc, no mTLS client config, and no libcurl-based application -- curl is only
# ever invoked as a CLI. It also carries no package manager: npm, npx, yarn and
# corepack live in the build stage only, so nothing under a package manager's own
# vendored tree can ever appear in a finding here.
#
# Scans intentionally do NOT pass --only-fixed, so no-fix malware advisories still
# gate. These are deliberate, reviewed exceptions, not a blanket.

ignore:
  # ─────────────────────────────────────────────────────────────────────────────
  # node 24.18.0 binary -- the July 2026 security release. These DO have a fix
  # (24.18.1, released 2026-07-28), but its image (node:24.18.1-alpine3.24, pushed
  # 2026-07-30) is short of the 45-day soak window until 2026-09-13. 24.18.0 is the
  # newest base that has soaked. Take 24.18.1+ at expiry and drop these three.
  # ─────────────────────────────────────────────────────────────────────────────
  - vulnerability: CVE-2026-58043
    reason: "Node Permission Model path matching over-grants filesystem access; the permission model is opt-in and this image never runs node with --permission (entrypoint is a plain `node <script>.mjs`), so there is no allowlist to over-grant; fixed in 24.18.1 which soaks 2026-09-13 [expires:2026-09-24]"
  - vulnerability: CVE-2026-56846
    reason: "Node HTTP/2 retained header blocks bypass maxSessionMemory (DoS); this is a server-side memory limit and the image runs no server of any kind -- it is a one-shot CI job that exits; fixed in 24.18.1 which soaks 2026-09-13 [expires:2026-09-24]"
  - vulnerability: CVE-2026-56848
    reason: "Node HTTP/2 re-entrant send causes heap use-after-free in nghttp2; requires an active HTTP/2 session and the drift detector opens none -- it speaks HTTPS/1.1 to the Anthropic API and runs no server; fixed in 24.18.1 which soaks 2026-09-13 [expires:2026-09-24]"

  # ─────────────────────────────────────────────────────────────────────────────
  # Our npm tree, at /opt/sdk/node_modules. This is the only JavaScript in the
  # runtime image, and it IS ours to fix -- a package-lock refresh takes it -- so
  # the only thing holding the fix back is the 45-day soak. Take the bump at expiry
  # rather than renewing.
  # ─────────────────────────────────────────────────────────────────────────────
  - vulnerability: GHSA-7p8r-x3mc-p8w7
    reason: "fast-uri treats a backslash as a normal character where Node's WHATWG URL parser treats it as an authority introducer, so a host-policy check can disagree with the URL actually fetched; exploitation requires using fast-uri to enforce host-based policy (allowlist, SSRF filter, redirect validation) and this image's only consumer is ajv, which uses it to resolve JSON-Schema $id/$ref identifiers -- registry keys that are never fetched -- against the Agent SDK's own bundled schemas, not attacker input; transitive via @anthropic-ai/claude-agent-sdk -> @modelcontextprotocol/sdk -> ajv; fix 3.1.5 published 2026-07-31 and soaks 2026-09-14 [expires:2026-09-24]"
