# Grype ignore rules for anchor-watch-image.
#
# CONVENTION: every rule's `reason` MUST carry an [expires:YYYY-MM-DD] tag. The
# `security:exception-audit` job fails the build when an entry expires or omits the
# tag, forcing re-review. At expiry, re-check: has a fix aged into the 45-day soak
# window, has reachability changed, is there a new advisory? Then renew the date or
# drop the rule and address the finding.
#
# Entries are listed PER CVE rather than by package type, so a new, fixable CVE in
# the same package still fails the build instead of hiding behind a blanket rule.
#
# An entry is deleted, not renewed, once the finding stops matching -- a rule that
# excepts nothing is indistinguishable from one that hides something.
#
# WHAT THIS IMAGE IS, for reachability purposes: a CI drift-detection runner. It
# executes inside an ephemeral GitLab job container, accepts no inbound network
# connections, is not internet-facing, and handles no untrusted input beyond the
# repository already checked out by the runner. Its only outbound traffic is HTTPS
# to the Anthropic API and to package/registry hosts, all trusted origins. It runs
# no server of any kind and exits when its one script finishes. No proxy, no
# .netrc, no mTLS client config, and no libcurl-based application -- curl is only
# ever invoked as a CLI. It also carries no package manager: npm, npx, yarn and
# corepack live in the build stage only, so nothing under a package manager's own
# vendored tree can ever appear in a finding here.
#
# Scans intentionally do NOT pass --only-fixed, so no-fix malware advisories still
# gate. These are deliberate, reviewed exceptions, not a blanket.

ignore:
  # ─────────────────────────────────────────────────────────────────────────────
  # Alpine base layer. Unlike the npm block below, this one has no fix to wait
  # for: upstream carries the patch on `develop` (madler/zlib df84af2, plus three
  # follow-ups) but has cut no release, and Alpine ships zlib-1.3.2-r0 unchanged
  # from 3.21 through edge. Grype matches it through the nvd:cpe fallback rather
  # than an Alpine advisory, because Alpine's tracker does not carry the CVE.
  #
  # The record's own metadata is unreliable -- OSV names the fix commit as the
  # v1.3.2 tag itself, i.e. the last affected release, which Debian flagged too --
  # but the bug is real: gz_vacate() and the unchecked memmove() are in v1.3.2 as
  # shipped. The exception rests on reachability, not on a pending version, so it
  # does not rot while Alpine has nothing to offer. Take the fixed apk when one
  # lands and drop this.
  # ─────────────────────────────────────────────────────────────────────────────
  - vulnerability: CVE-2026-85091
    reason: "zlib gz_vacate() does an unchecked memmove() into the internal input buffer when a non-blocking gzwrite() stalls and leaves strm->next_in pointing at the caller's buffer, so a following gzprintf()/gzvprintf() writes past it; exploitation requires the gzFile API on a non-blocking descriptor, and nothing in this image uses it -- no ELF here imports a single gz* symbol, because curl, libcurl, git and its http helpers, libapk and apk all link libz for the raw z_stream API (inflate/deflate/crc32) only, while busybox, bash and jq do not link it at all; node, the only process that runs at runtime, links no libz either and bundles zlib 1.3.1, below the 1.3.1.2 floor of the affected range; no released fix exists in any Alpine branch [expires:2026-12-18]"

  # ─────────────────────────────────────────────────────────────────────────────
  # Our npm tree, at /opt/sdk/node_modules. This is the only JavaScript in the
  # runtime image, and it IS ours to fix -- a package-lock refresh takes it -- so
  # the only thing holding the fix back is the 45-day soak.
  #
  # Every entry below is fast-uri, and they are one shape of bug wearing five hats:
  # a URL-parsing disagreement that only matters to an application which normalises
  # an untrusted URL and then makes a security decision on the result -- a host
  # allowlist, an SSRF filter, a redirect check, an outbound fetch. This image's
  # only consumer of fast-uri is ajv, which uses it to turn JSON-Schema $id/$ref
  # into registry keys. Those keys are looked up, never fetched, so no host policy
  # is ever decided from a fast-uri parse here. The chain is
  # @anthropic-ai/claude-agent-sdk -> @modelcontextprotocol/sdk -> ajv -> fast-uri,
  # both of the middle links as peer dependencies.
  #
  # 3.1.7 is the version that clears this block. 3.1.5 fixes only the first entry
  # and is vulnerable to the other four; 3.1.6 fixes those four and is vulnerable to
  # two later advisories. 3.1.7 published 2026-09-02 and soaks 2026-10-17, which is
  # the date every entry in this block is held to.
  #
  # fast-uri is under a sustained advisory campaign -- ten and counting, all of this
  # same class. Expect more, and expect them to arrive without a version change on
  # our side.
  # ─────────────────────────────────────────────────────────────────────────────
  - vulnerability: GHSA-7p8r-x3mc-p8w7
    reason: "fast-uri treats a backslash as a normal character where Node's WHATWG URL parser treats it as an authority introducer, so a host-policy check can disagree with the URL actually fetched; exploitation requires using fast-uri to enforce host-based policy (allowlist, SSRF filter, redirect validation) and this image's only consumer is ajv, which uses it to resolve JSON-Schema $id/$ref identifiers -- registry keys that are never fetched -- against the Agent SDK's own bundled schemas, not attacker input; transitive via @anthropic-ai/claude-agent-sdk -> @modelcontextprotocol/sdk -> ajv; 3.1.5 fixes this advisory alone and is vulnerable to the four below, so the real target is 3.1.7, published 2026-09-02 and soaking 2026-10-17 [expires:2026-10-24]"
  - vulnerability: GHSA-5jgf-p345-68v8
    reason: "fast-uri skips IDN-to-ASCII canonicalisation when resolving a scheme-relative reference (//host/) against a base carrying an explicit scheme, so a caller can vet one hostname and reach another; exploitation requires resolving an untrusted scheme-relative reference and then enforcing policy on the result, and ajv -- this image's only consumer -- resolves JSON-Schema $id/$ref into registry keys that are never fetched and never policy-checked; transitive via @anthropic-ai/claude-agent-sdk -> @modelcontextprotocol/sdk -> ajv; fix 3.1.6 is itself superseded, so the real target is 3.1.7, published 2026-09-02 and soaking 2026-10-17 [expires:2026-10-24]"
  - vulnerability: GHSA-fph4-wmhf-6fwf
    reason: "fast-uri percent-decodes the hostname twice in normalize()/resolve(), so a nested encoding such as http://%256c%256f%2563%2561%256c%2568%256f%2573%2574/ collapses to http://localhost/ after an allowlist has already passed it; exploitation requires normalising an untrusted URI ahead of an SSRF check or an outbound request, and this image makes no outbound request from a fast-uri parse -- ajv resolves JSON-Schema $id/$ref into registry keys and fetches nothing; transitive via @anthropic-ai/claude-agent-sdk -> @modelcontextprotocol/sdk -> ajv; fix 3.1.6 is itself superseded, so the real target is 3.1.7, published 2026-09-02 and soaking 2026-10-17 [expires:2026-10-24]"
  - vulnerability: GHSA-f65p-4m7j-42xc
    reason: "fast-uri silently truncates a malformed bracketed IPv6 literal instead of rejecting it, and leaves parse().error unset, so a caller checking for a parse failure routes to loopback or a private range believing the input was valid; exploitation requires normalising an untrusted URL before an outbound request or an access-control check, neither of which happens here -- ajv resolves JSON-Schema $id/$ref into registry keys, which are compared, not dialled; transitive via @anthropic-ai/claude-agent-sdk -> @modelcontextprotocol/sdk -> ajv; fix 3.1.6 is itself superseded, so the real target is 3.1.7, published 2026-09-02 and soaking 2026-10-17 [expires:2026-10-24]"
  - vulnerability: GHSA-jqff-g426-hqxp
    reason: "fast-uri decodes percent-escapes in the scheme component with the legacy global unescape() and re-serialises the result raw, without re-escaping or validating it as a scheme, so an input like %2f%2fevil.example:/pwn can normalise into a different authority or carry CR LF onward into a response header; exploitation requires normalising an untrusted URL and then acting on the scheme or authority, and this image writes no HTTP response and decides no host policy from a fast-uri parse -- ajv resolves JSON-Schema $id/$ref into registry keys; transitive via @anthropic-ai/claude-agent-sdk -> @modelcontextprotocol/sdk -> ajv; fix 3.1.6 is itself superseded, so the real target is 3.1.7, published 2026-09-02 and soaking 2026-10-17 [expires:2026-10-24]"
