############################
# Setup
############################
image: docker:latest

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

############################
# Stages
############################
stages:
  - lint
  - build

############################
# Lint
############################
lint:dockerfile:
  stage: lint
  image: hadolint/hadolint:v2.14.0-alpine@sha256:7aba693c1442eb31c0b015c129697cb3b6cb7da589d85c7562f9deb435a6657c
  script:
    - hadolint Dockerfile --ignore DL3008 --ignore DL3015

##############################
# Docker/Build
##############################
# Base template for Docker jobs
.docker:base:
  stage: build
  image: docker:29.2.1-dind-alpine3.23@sha256:68f6d9ab84623d1116c5432a3b924a07ee09960e6129ca1cb03ef14010588cb4
  services:
    - docker:dind
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker context create my-builder
    - docker buildx create my-builder --driver docker-container --use
  retry: 2

# Build only (for non-main branches)
docker:build:
  extends: .docker:base
  script:
    - >
      docker buildx build
      --platform linux/amd64,linux/arm64
      --tag $CI_REGISTRY_IMAGE:test
      --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/cache-image
      --provenance=false
      -f Dockerfile .
  rules:
    - if: $CI_COMMIT_REF_NAME != "main"

# Build and push (for main branch only)
docker:push:
  extends: .docker:base
  script:
    - >
      docker buildx build --push
      --platform linux/amd64,linux/arm64
      --tag $CI_REGISTRY_IMAGE:latest
      --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/cache-image,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
      --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/cache-image
      --provenance=false
      -f Dockerfile .
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
